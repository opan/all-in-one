server:
  port: 8080
  swagger_enabled: false  # Set to true locally for API docs at /swagger/index.html
  # allowed_origins: ["https://your-frontend.com", "https://shortener.yourapp.com"]
  # Defaults to ["*"] when omitted. Set explicitly in production.

storage:
  type: "sqlite"  # Options: "memory", "sqlite", or "postgres"
  sqlite:
    db_path: "all-in-one.db"
  postgres:
    host: "localhost"
    port: 5432
    user: "allinone"
    password: "allinone"
    dbname: "allinone"
    sslmode: "disable"  # use "require"/"verify-full" in production

log:
  level: "debug"  # Options: "debug", "info", "warn", "error"

http:
  timeout: 30 # in seconds

auth:
  jwt_secret: "replace-this-on-production"
  direct_auth_enabled: false  # Enable direct authentication via x-direct-auth-username header (for development/testing only)
  secure_cookie: false # Set to true in production with HTTPS
  totp_encryption_key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"  # 32-byte hex key - REPLACE in production!

rbac:
  admin_username: "admin"          # initial admin; assigned to the admin group only when it's empty
  direct_auth_is_admin: true       # dev bypass (x-direct-auth-username) is treated as superuser

ratelimit:
  enabled: true             # master kill switch; per-target limits/toggles live in the DB (admin-editable)
  cache_refresh_interval: 30s  # backstop refresh of the in-memory rule cache (writes also reload immediately)
  cleanup_interval: 1h      # how often expired daily-quota counter rows are pruned
  counter_retention_days: 3 # how many days of daily-quota counter rows to keep
  timezone: "UTC"           # timezone daily-quota calendar-day buckets are computed in
  trust_proxy_headers: false # set true only behind a sanitizing reverse proxy that sets X-Forwarded-For

shortener:
  code_length: 7
  max_create_retries: 5
  # Rate limits for link creation/resolution are managed by the ratelimit
  # app-feature (admin API / DB), not here — see ADR-011.
  url:
    max_length: 2048
    allowed_schemes: ["http", "https"]
    blocked_hosts: []

demo_mode:
  enabled: true          # advertise the shared demo account on landing + login; set false to hide it AND block the demo user (abuse guard rail)
  username: "demo"       # the account visitors log in with — create it out of band
  password: "demo123"    # shown publicly via GET /api/v1/config; keep it low-value

telemetry:
  enabled: false           # Toggle OTel SDK on/off without rebuilding
  service_name: "all-in-one"
  service_version: "1.0.0"
  environment: "local"     # local | staging | production
  otlp_endpoint: "localhost:4318"  # host:port (no scheme) of OTLP/HTTP collector
  otlp_insecure: true      # set false in production with TLS
  sample_ratio: 1.0        # 0.0–1.0. Use 0.1 in production.
  metric_interval: 15s     # how often metrics are pushed to the collector

