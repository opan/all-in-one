server:
  port: 8080

storage:
  type: "sqlite"  # Options: "memory" or "sqlite"
  sqlite:
    db_path: "all-in-one.db"

log:
  level: "debug"  # Options: "debug", "info", "warn", "error"

http:
  timeout: 30 # in seconds

auth:
  jwt_secret: "replace-this-on-production"
  direct_auth_enabled: false  # Enable direct authentication via x-direct-auth-username header (for development/testing only)
  secure_cookie: false # Set to true in production with HTTPS

listing:
  port: 8080

