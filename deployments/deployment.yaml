apiVersion: apps/v1
kind: Deployment
metadata:
  name: all-in-one
  labels:
    app: all-in-one
spec:
  replicas: 1  # SQLite does not support concurrent multi-process writes; keep at 1
  selector:
    matchLabels:
      app: all-in-one
  template:
    metadata:
      labels:
        app: all-in-one
    spec:
      containers:
      - name: all-in-one
        image: YOUR_REGISTRY/all-in-one:latest  # Update with your registry
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ALLINONE_SERVER_PORT
          value: "8080"
        - name: ALLINONE_AUTH_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: all-in-one-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: all-in-one-data
      - name: config
        configMap:
          name: all-in-one-config
