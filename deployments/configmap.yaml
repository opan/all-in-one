apiVersion: v1
kind: ConfigMap
metadata:
  name: all-in-one-config
data:
  config.yml: |
    server:
      port: 8080

    storage:
      type: "sqlite"
      sqlite:
        db_path: "/data/all-in-one.db"

    log:
      level: "info"

    http:
      timeout: 30

    auth:
      direct_auth_enabled: false
      secure_cookie: true
      # jwt_secret is intentionally omitted here; set via AUTH_JWT_SECRET env var
