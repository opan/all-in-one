apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- pvc.yaml
- configmap.yaml
- deployment.yaml
- service.yaml
- ingress.yaml

namespace: default  # Update with your namespace

commonLabels:
  app: all-in-one
  managed-by: kustomize

images:
- name: YOUR_REGISTRY/all-in-one
  newTag: latest  # Will be updated by CI/CD
