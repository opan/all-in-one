# Local-dev observability stack for OpenTelemetry phase 3.
#
# Architecture:
#   App → OTLP/HTTP:4318 → OTel Collector ─┬─ Jaeger  (traces)  :16686
#                                            └─ Prometheus (metrics) :9090
#
# Run:
#   docker compose -f docker-compose.otel.yml up -d
#   ALLINONE_TELEMETRY_ENABLED=true go run main.go all-in-one server
#
# Stop:
#   docker compose -f docker-compose.otel.yml down

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: all-in-one-otel-collector
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./.docker/otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      - "4318:4318"    # OTLP/HTTP receiver (used by the Go app)
      - "8889:8889"    # Prometheus metrics exporter (scraped by Prometheus)
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: all-in-one-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP/gRPC receiver (used by the collector)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: all-in-one-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=1d"
    volumes:
      - ./.docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"    # Prometheus UI
    depends_on:
      - otel-collector
    restart: unless-stopped
