# Weekly pull requests to keep Go modules, the web app's npm packages, the
# Docker base images, and the GitHub Actions current (security fixes land
# through these too).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-modules: { patterns: ['*'] }
  # Minor and patch only: major upgrades (SvelteKit, Vite, TypeScript, ...)
  # need migrations and are done by hand.
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ['*'], update-types: [minor, patch] }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  # Node majors are skipped: odd releases never become LTS (#39 moved to 25,
  # already end-of-life). Move to the next even LTS by hand.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
