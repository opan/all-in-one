securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
  DirectAuth:
    description: Direct authentication bypass for testing (only works when DirectAuthEnabled
      is true in config). Provide username directly.
    in: header
    name: x-direct-auth-username
    type: apiKey
