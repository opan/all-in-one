      tags:
      - items
    put:
      consumes:
      - application/json
      description: Update an existing listing item by ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated item data
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/github_com_all-in-one_internal_listing_pkg_model.Item'
