basePath: /api/v1
definitions:
  http.Response:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  model.Item:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      title:
        type: string
      topic_id:
        type: integer
      updated_at:
        type: string
    type: object
  model.Topic:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for managing listing items
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Listing API
  version: "1.0"
paths:
  /topics:
    get:
      description: Retrieve a list of all topics
      produces:
      - application/json
      responses:
        "200":
          description: List of topics
          schema:
            allOf:
            - $ref: '#/definitions/http.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Topic'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.Response'
      summary: Get all topics
      tags:
      - topics
    post:
      consumes:
      - application/json
      description: Create a new topic
      parameters:
      - description: Topic to create
        in: body
        name: topic
        required: true
        schema:
          $ref: '#/definitions/model.Topic'
      produces:
      - application/json
      responses:
        "201":
          description: Topic created successfully
          schema:
            allOf:
            - $ref: '#/definitions/http.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Topic'
              type: object
        "400":
          description: Invalid JSON data or missing required fields
          schema:
            $ref: '#/definitions/http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.Response'
      summary: Create a new topic
      tags:
      - topics
  /topics/{id}:
    delete:
      description: Delete a topic by ID
      parameters:
      - description: Topic ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Topic deleted successfully
          schema:
            $ref: '#/definitions/http.Response'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/http.Response'
        "404":
          description: Topic not found
          schema:
            $ref: '#/definitions/http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.Response'
      summary: Delete a topic
      tags:
      - topics
    get:
      description: Retrieve a single topic by its ID
      parameters:
      - description: Topic ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Topic details
          schema:
            allOf:
            - $ref: '#/definitions/http.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Topic'
              type: object
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/http.Response'
        "404":
          description: Topic not found
          schema:
            $ref: '#/definitions/http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.Response'
      summary: Get topic by ID
      tags:
      - topics
    put:
      consumes:
      - application/json
      description: Update an existing topic by ID
      parameters:
      - description: Topic ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated topic data
        in: body
        name: topic
        required: true
        schema:
          $ref: '#/definitions/model.Topic'
      produces:
      - application/json
      responses:
        "200":
          description: Topic updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/http.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Topic'
              type: object
        "400":
          description: Invalid ID or JSON data
          schema:
            $ref: '#/definitions/http.Response'
        "404":
          description: Topic not found
          schema:
            $ref: '#/definitions/http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.Response'
      summary: Update an existing topic
      tags:
      - topics
  /topics/{topic_id}/items:
    get:
      description: Retrieve a list of all items for a specific topic
      parameters:
      - description: Topic ID
        in: path
        name: topic_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of items
          schema:
            allOf:
            - $ref: '#/definitions/http.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Item'
                  type: array
              type: object
        "400":
          description: Invalid topic ID
          schema:
            $ref: '#/definitions/http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.Response'
      summary: Get all items for a topic
      tags:
      - items
    post:
      consumes:
      - application/json
      description: Create a new item within a topic
      parameters:
      - description: Topic ID
        in: path
        name: topic_id
        required: true
        type: integer
      - description: Item to create
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/model.Item'
      produces:
      - application/json
      responses:
        "201":
          description: Item created successfully
          schema:
            allOf:
            - $ref: '#/definitions/http.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Item'
              type: object
        "400":
          description: Invalid JSON data or missing required fields
          schema:
            $ref: '#/definitions/http.Response'
        "404":
          description: Topic not found
          schema:
            $ref: '#/definitions/http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.Response'
      summary: Create a new item
      tags:
      - items
  /topics/{topic_id}/items/{id}:
    delete:
      description: Delete an item by ID within a topic
      parameters:
      - description: Topic ID
        in: path
        name: topic_id
        required: true
        type: integer
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Item deleted successfully
          schema:
            $ref: '#/definitions/http.Response'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/http.Response'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.Response'
      summary: Delete an item
      tags:
      - items
    get:
      description: Retrieve a single item by its ID within a topic
      parameters:
      - description: Topic ID
        in: path
        name: topic_id
        required: true
        type: integer
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Item details
          schema:
            allOf:
            - $ref: '#/definitions/http.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Item'
              type: object
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/http.Response'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.Response'
      summary: Get item by ID
      tags:
      - items
    put:
      consumes:
      - application/json
      description: Update an existing item by ID within a topic
      parameters:
      - description: Topic ID
        in: path
        name: topic_id
        required: true
        type: integer
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated item data
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/model.Item'
      produces:
      - application/json
      responses:
        "200":
          description: Item updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/http.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Item'
              type: object
        "400":
          description: Invalid ID or JSON data
          schema:
            $ref: '#/definitions/http.Response'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.Response'
      summary: Update an existing item
      tags:
      - items
schemes:
- http
swagger: "2.0"
