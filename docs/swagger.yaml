basePath: /api/v1
definitions:
  github_com_all-in-one_internal_http.Response:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  handler.RegisterUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  model.FormSchema:
    properties:
      schema:
        $ref: '#/definitions/model.JSONSchema'
      uischema:
        $ref: '#/definitions/model.UISchema'
    type: object
  model.Item:
    properties:
      created_at:
        type: string
      description:
        type: string
      form_schema_values:
        items:
          type: integer
        type: array
      id:
        type: integer
      title:
        type: string
      topic_id:
        type: integer
      updated_at:
        type: string
    type: object
  model.JSONSchema:
    properties:
      properties:
        additionalProperties:
          $ref: '#/definitions/model.JSONSchemaProperty'
        type: object
      required:
        items:
          type: string
        type: array
      type:
        type: string
    type: object
  model.JSONSchemaProperty:
    properties:
      default: {}
      description:
        type: string
      enum:
        items:
          type: string
        type: array
      format:
        type: string
      items:
        $ref: '#/definitions/model.JSONSchemaPropertyItems'
      title:
        type: string
      type:
        type: string
    type: object
  model.JSONSchemaPropertyItems:
    properties:
      enum:
        items:
          type: string
        type: array
      type:
        type: string
    type: object
  model.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  model.Topic:
    properties:
      created_at:
        type: string
      description:
        type: string
      form_schema:
        $ref: '#/definitions/model.FormSchema'
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  model.UISchema:
    properties:
      elements:
        items:
          $ref: '#/definitions/model.UISchemaElement'
        type: array
      label: {}
      options:
        additionalProperties: true
        type: object
      scope:
        type: string
      type:
        type: string
    type: object
  model.UISchemaElement:
    properties:
      elements:
        items:
          $ref: '#/definitions/model.UISchemaElement'
        type: array
      label:
        description: string or bool
      options:
        additionalProperties: true
        type: object
      scope:
        type: string
      type:
        type: string
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_login:
        type: string
      name:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  model.UserPasswordReset:
    properties:
      current_password:
        type: string
      password:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: All-in-one is a multi-functional apps with the main goal for learning
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: All-in-one API
  version: "1.0"
paths:
  /sessions:
    delete:
      description: Invalidate the current session and clear authentication cookies
      produces:
      - application/json
      responses:
        "200":
          description: Session deleted successfully
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      security:
      - ApiKeyAuth: []
      summary: Delete session (logout)
      tags:
      - sessions
    post:
      consumes:
      - application/json
      description: Authenticate user and create a new session with access and refresh
        tokens
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Session created successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "404":
          description: Username or password not found
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      summary: Create a new session (login)
      tags:
      - sessions
  /sessions/refresh:
    post:
      description: Generate a new access token using a valid refresh token
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed successfully
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "401":
          description: Unauthorized - invalid or missing refresh token
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      security:
      - ApiKeyAuth: []
      summary: Refresh access token
      tags:
      - sessions
  /topics:
    get:
      description: Retrieve a list of all topics
      produces:
      - application/json
      responses:
        "200":
          description: List of topics
          schema:
            allOf:
            - $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Topic'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      summary: Get all topics
      tags:
      - topics
    post:
      consumes:
      - application/json
      description: Create a new topic
      parameters:
      - description: Topic to create
        in: body
        name: topic
        required: true
        schema:
          $ref: '#/definitions/model.Topic'
      produces:
      - application/json
      responses:
        "201":
          description: Topic created successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Topic'
              type: object
        "400":
          description: Invalid JSON data or missing required fields
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      summary: Create a new topic
      tags:
      - topics
  /topics/{id}:
    delete:
      description: Delete a topic by ID
      parameters:
      - description: Topic ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Topic deleted successfully
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "404":
          description: Topic not found
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      summary: Delete a topic
      tags:
      - topics
    get:
      description: Retrieve a single topic by its ID
      parameters:
      - description: Topic ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Topic details
          schema:
            allOf:
            - $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Topic'
              type: object
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "404":
          description: Topic not found
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      summary: Get topic by ID
      tags:
      - topics
    put:
      consumes:
      - application/json
      description: Update an existing topic by ID
      parameters:
      - description: Topic ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated topic data
        in: body
        name: topic
        required: true
        schema:
          $ref: '#/definitions/model.Topic'
      produces:
      - application/json
      responses:
        "200":
          description: Topic updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Topic'
              type: object
        "400":
          description: Invalid ID or JSON data
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "404":
          description: Topic not found
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      summary: Update an existing topic
      tags:
      - topics
  /topics/{topic_id}/items:
    get:
      description: Retrieve a list of all items for a specific topic
      parameters:
      - description: Topic ID
        in: path
        name: topic_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of items
          schema:
            allOf:
            - $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Item'
                  type: array
              type: object
        "400":
          description: Invalid topic ID
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      summary: Get all items for a topic
      tags:
      - items
    post:
      consumes:
      - application/json
      description: Create a new item within a topic
      parameters:
      - description: Topic ID
        in: path
        name: topic_id
        required: true
        type: integer
      - description: Item to create
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/model.Item'
      produces:
      - application/json
      responses:
        "201":
          description: Item created successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Item'
              type: object
        "400":
          description: Invalid JSON data or missing required fields
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "404":
          description: Topic not found
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      summary: Create a new item
      tags:
      - items
  /topics/{topic_id}/items/{id}:
    delete:
      description: Delete an item by ID within a topic
      parameters:
      - description: Topic ID
        in: path
        name: topic_id
        required: true
        type: integer
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Item deleted successfully
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      summary: Delete an item
      tags:
      - items
    get:
      description: Retrieve a single item by its ID within a topic
      parameters:
      - description: Topic ID
        in: path
        name: topic_id
        required: true
        type: integer
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Item details
          schema:
            allOf:
            - $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Item'
              type: object
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      summary: Get item by ID
      tags:
      - items
    put:
      consumes:
      - application/json
      description: Update an existing item by ID within a topic
      parameters:
      - description: Topic ID
        in: path
        name: topic_id
        required: true
        type: integer
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated item data
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/model.Item'
      produces:
      - application/json
      responses:
        "200":
          description: Item updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Item'
              type: object
        "400":
          description: Invalid ID or JSON data
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      summary: Update an existing item
      tags:
      - items
  /users/me:
    get:
      description: Retrieve the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            allOf:
            - $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      security:
      - BearerAuth: []
      summary: Get current authenticated user
      tags:
      - users
  /users/me/password:
    put:
      consumes:
      - application/json
      description: Reset the password for the currently authenticated user
      parameters:
      - description: Current and new password
        in: body
        name: password
        required: true
        schema:
          $ref: '#/definitions/model.UserPasswordReset'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "401":
          description: Unauthorized or invalid current password
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      security:
      - BearerAuth: []
      summary: Reset user password
      tags:
      - users
  /users/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with username, password, email, and name
      parameters:
      - description: User registration details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "400":
          description: Invalid request body or missing required fields
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_all-in-one_internal_http.Response'
      summary: Register a new user
      tags:
      - users
schemes:
- http
swagger: "2.0"
